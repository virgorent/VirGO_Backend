name: API CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: csharp
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Build API
        working-directory: VirGo-API
        run: dotnet build VirGo.slnx -c Release
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066

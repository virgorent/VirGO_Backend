AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  VirGo bootstrap (900 T102/T107): GitHub OIDC, the GitHub deploy role and the CloudFormation
  execution role. Created once by a person; every later deploy runs from GitHub Actions.

Parameters:
  GitHubRepository:
    Type: String
    Default: virgorent/VirGO_Backend
    Description: GitHub repository allowed to deploy the API.
  GitHubRepositoryWithIds:
    Type: String
    Default: virgorent@352551934/VirGO_Backend@1445981483
    Description: >-
      Same repository with GitHub's immutable owner and repository IDs, as GitHub now sends it in the
      OIDC sub claim. A repository recreated with the same name gets new IDs and cannot deploy.
  StackName:
    Type: String
    Default: virgo-api-prod
    Description: Application stack that GitHub may update.
  CreateBudget:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: The one-dollar budget virgo-1usd already exists (created with the CLI on 2026-11-11). Set to true only in a new account.
  AlertEmail:
    Type: String
    Default: ''
    Description: Budget alert email; only used when CreateBudget is true.

Conditions:
  ShouldCreateBudget: !Equals [!Ref CreateBudget, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # Rol que asume GitHub Actions. Solo puede pedirle a CloudFormation que actualice el stack
  # de la API y subir el paquete; los recursos los crea el rol de ejecución de abajo.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: virgo-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepositoryWithIds}:environment:production
                  - !Sub repo:${GitHubRepository}:environment:production
      Policies:
        - PolicyName: VirGoDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UpdateTheApiStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: UseTheSamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ReadTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: UploadPackages
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: HandTheExecutionRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # Rol que usa CloudFormation para crear y cambiar los recursos del stack. Cada permiso está
  # limitado a los nombres virgo-*; los '*' son acciones que AWS no permite limitar por recurso.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_107
            comment: No credential-exposure actions; log delivery actions require Resource '*'.
          - id: CKV_AWS_108
            comment: s3:GetObject is limited to the SAM artifacts bucket and the media bucket.
          - id: CKV_AWS_109
            comment: IAM and resource-policy writes are limited to roles, queues and buckets named for this stack.
          - id: CKV_AWS_110
            comment: iam:PassRole and role writes are limited to roles named for this stack; managed policies are allow-listed.
          - id: CKV_AWS_111
            comment: Write actions on '*' are only those AWS cannot scope (log delivery, CloudFront OAC creation, event source mappings).
    Properties:
      RoleName: virgo-cfn-exec
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: VirGoStackResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UseTheSamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: Functions
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:virgo-*
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*
              - Sid: EventSourceMappings
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:ListEventSourceMappings
                  - lambda:GetEventSourceMapping
                Resource: '*'
              - Sid: ReadPackages
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: HttpApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              - Sid: StackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*
              - Sid: AllowListedManagedPolicies
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                      - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
                      - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSXrayWriteOnlyAccess
                      - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess
              - Sid: Queues
                Effect: Allow
                Action: sqs:*
                Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:virgo-jobs*
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/virgo-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/virgo-*
              - Sid: AccessLogDelivery
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                Resource: '*'
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${StackName}-*
              - Sid: ReadAlarms
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: '*'
              - Sid: Dashboard
                Effect: Allow
                Action:
                  - cloudwatch:PutDashboard
                  - cloudwatch:GetDashboard
                  - cloudwatch:DeleteDashboards
                Resource: !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/virgo-api
              - Sid: AlertTopic
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:GetSubscriptionAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:virgo-alerts
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:virgo-alerts:*
              - Sid: MediaBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::virgo-media-${AWS::AccountId}
                  - !Sub arn:${AWS::Partition}:s3:::virgo-media-${AWS::AccountId}/*
              - Sid: MediaDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
              - Sid: MediaDistributionUnscoped
                Effect: Allow
                Action:
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:ListOriginAccessControls
                  - cloudfront:GetCachePolicy
                  - cloudfront:GetResponseHeadersPolicy
                Resource: '*'
              - Sid: Schedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:GetSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:TagResource
                  - scheduler:UntagResource
                  - scheduler:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/virgo-*

  Budget:
    Type: AWS::Budgets::Budget
    Condition: ShouldCreateBudget
    Properties:
      Budget:
        BudgetName: virgo-1usd
        BudgetLimit:
          Amount: 1
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 1
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL

Outputs:
  GitHubDeployRoleArn:
    Description: Value for the AWS_ROLE_ARN variable of the GitHub environment production.
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Value for the AWS_CFN_EXEC_ROLE_ARN variable of the GitHub environment production.
    Value: !GetAtt CloudFormationExecutionRole.Arn
